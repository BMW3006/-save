name = "nadhili-db-worker"
main = "src/worker.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# KV Namespace for caching search results
[[kv_namespaces]]
binding = "CACHE"
id = "your-kv-id"
preview_id = "your-preview-id"

# R2 Bucket for storing movie data
[[r2_buckets]]
binding = "MOVIE_CACHE"
bucket_name = "nadhili-movie-cache"

[env.development]
vars = { ENVIRONMENT = "development" }

[env.production]
route = "https://nadhili-db.workers.dev/*"
zone_id = ""
vars = { ENVIRONMENT = "production" }
